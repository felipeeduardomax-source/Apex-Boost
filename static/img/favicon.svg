<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
  </defs>
  <!-- Rounded squircle background with electric blue gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#apexGrad)" />
  <!-- Subtle inner highlight border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <!-- Bold Heroic Centered Lightning Bolt (Apex Boost) -->
  <polygon points="32,11 39,11 48,28 34,30.5 32,53 25,53 16,33.5 30,31" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
</svg>
